<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Listagem de Tutores</title>
</h:head>
<h:body>
    <h:form id="formTutor">
        <p:growl showDetail="true" showSummary="true"/>

        <h1>Listagem de Tutores</h1>

        <p:commandButton action="tutor.xhtml" icon="fa fa-file-o" value="Novo tutor"/>
        <p:button outcome="/index.xhtml" icon="fa fa-ban" value="Cancelar"/>

        <br/>
        <br/>

        <p:dataTable value="#{tutorBean.tutores}" var="t">
            <p:column headerText="Id">
                <h:outputText value="#{t.id}"/>
            </p:column>

            <p:column headerText="Nome">
                <h:outputText value="#{t.nome}"/>
            </p:column>

            <p:column headerText="Telefone">
                <h:outputText value="#{t.telefone}"/>
            </p:column>

            <p:column headerText="E-mail">
                <h:outputText value="#{t.email}"/>
            </p:column>

            <p:column headerText="Operações">
                <p:commandButton value="Editar"
                                 icon="fa fa-pencil"
                                 action="/tutor.xhtml"
                                 ajax="false">
                    <f:setPropertyActionListener target="#{tutorBean.tutor}" value="#{t}"/>
                </p:commandButton>

                <p:commandButton value="Excluir"
                                 icon="fa fa-trash-o"
                                 action="#{tutorBean.excluir()}"
                                 ajax="false">
                    <f:setPropertyActionListener target="#{tutorBean.tutor}" value="#{t}"/>
                </p:commandButton>
            </p:column>

        </p:dataTable>
    </h:form>
</h:body>
</html>
