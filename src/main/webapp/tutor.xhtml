<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Cadastro/Edição de Tutor</title>
</h:head>
<h:body>
    <h1>Cadastro de Tutor</h1>
    <h:form id="formTutor">
        <p:growl showDetail="true" showSummary="true"/>
        <h:inputHidden value="#{tutorBean.tutor.id}"/>
        <h:panelGrid id="painel" columns="2">
            <p:outputLabel value="Nome" for="itNome"/>
            <p:inputText id="itNome" value="#{tutorBean.tutor.nome}" required="true" requiredMessage="Nome é um campo necessário"/>

            <p:outputLabel value="Telefone" for="imTelefone"/>
            <p:inputMask id="imTelefone" mask="999999999" value="#{tutorBean.tutor.telefone}" required="true" requiredMessage="Telefone é um campo necessário"/>

            <p:outputLabel value="E-mail" for="itEmail"/>
            <p:inputText id="itEmail" value="#{tutorBean.tutor.email}"/>
        </h:panelGrid>

        <p:button outcome="/tutores.xhtml" icon="fa fa-ban" value="Cancelar"/>
        <p:commandButton action="#{tutorBean.salvar()}" icon="fa fa-floppy-o" value="Salvar" ajax="false"/>
    </h:form>
</h:body>
</html>
